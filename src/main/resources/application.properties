spring.application.name=onward-gateway
server.port=8081

# Token verification; values mirror app.auth.* in Account.
gateway.auth.jwk-set-uri=http://localhost:8080/.well-known/jwks.json
gateway.auth.issuer=onward
gateway.auth.audience=onward-api
# Reachable without a token: Account's public auth flows and the key discovery document.
gateway.auth.public-paths[0]=/.well-known/jwks.json
gateway.auth.public-paths[1]=/api/auth/csrf
gateway.auth.public-paths[2]=/api/auth/register
gateway.auth.public-paths[3]=/api/auth/login
gateway.auth.public-paths[4]=/api/auth/refresh
gateway.auth.public-paths[5]=/api/auth/logout
gateway.auth.public-paths[6]=/api/auth/verify-email
gateway.auth.public-paths[7]=/api/auth/verification/resend
gateway.auth.public-paths[8]=/api/auth/forgot-password
gateway.auth.public-paths[9]=/api/auth/reset-password

# Routes. Account owns everything today; the Project/Task service gets its own route later.
spring.cloud.gateway.server.webflux.routes[0].id=account
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**,/.well-known/**
