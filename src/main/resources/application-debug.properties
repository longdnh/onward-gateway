# Run with --spring.profiles.active=debug (or the "Gateway - debug logging" launch config) to watch one
# request walk through the gateway. See onward-be/docs/en/debugging.md.

# Which route matched, and which gateway filters run.
logging.level.org.springframework.cloud.gateway=DEBUG
# Spring Security: which security filter chain matched, authentication outcome, 401/403 decisions.
logging.level.org.springframework.security=DEBUG
# Our two filters: denylist decision per request, rate-limit decision per limited request (never the token).
logging.level.com.longdnh.onward.gateway=DEBUG
# Lettuce (Redis client): connection events. Raise to DEBUG to see every command.
logging.level.io.lettuce.core=INFO

# Raw bytes of what the gateway sends to Account and receives back. Very noisy; uncomment when needed.
#spring.cloud.gateway.server.webflux.httpclient.wiretap=true
#logging.level.reactor.netty.http.client=DEBUG
